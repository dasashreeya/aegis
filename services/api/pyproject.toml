[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aegis-api"
version = "0.1.0"
description = "Aegis automated decision oversight API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.7,<3",
  "uvicorn[standard]>=0.34,<1",
  "z3-solver>=4.13,<5",
]

[project.optional-dependencies]
cloud = [
  "google-cloud-firestore>=2.20,<3",
  "google-cloud-pubsub>=2.27,<3",
]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
