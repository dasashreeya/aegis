[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aegis-api"
version = "0.1.0"
description = "Aegis automated decision oversight API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.7,<3",
  "uvicorn[standard]>=0.34,<1",
  "z3-solver>=4.13,<5",
]

[project.optional-dependencies]
cloud = [
  "google-cloud-firestore>=2.20,<3",
  "google-cloud-pubsub>=2.27,<3",
]
llm = [
  "google-genai>=2.20,<3",
]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]
# The fleet runtime. Without it the seven steps still run in process, which is
# what CI exercises, so nothing here is required for the tests to pass.
agents = [
  "google-adk>=2.8,<3",
  "google-genai>=2.20,<3",
]
telemetry = [
  "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-instrumentation-fastapi>=0.50b0",
  "opentelemetry-exporter-gcp-trace>=1.9,<2",
]
armor = [
  "google-cloud-modelarmor>=0.7,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: hits real Vertex AI and costs money; skipped unless run with -m live",
]

[tool.ruff]
line-length = 100
target-version = "py311"
